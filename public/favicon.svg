<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer Dark Bezel Hexagon / Cube Matrix -->
  <rect width="64" height="64" rx="14" fill="#06070a"/>
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
  
  <!-- Stylized 3D Isometric PC Cube / Die-Cast GPU Chassis -->
  <!-- Top Face -->
  <path d="M32 10L50 20.5L32 31L14 20.5L32 10Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Left Face -->
  <path d="M14 20.5L32 31V53L14 42.5V20.5Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Right Face (Tempered Glass Side with ARGB Core) -->
  <path d="M32 31L50 20.5V42.5L32 53V31Z" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Internal Illuminating Hardware Core / Silicon Die -->
  <path d="M32 23L41 28.2L32 33.5L23 28.2L32 23Z" fill="#38bdf8" />
  <circle cx="32" cy="32" r="3" fill="#ffffff"/>
  
  <!-- Accent Tech Circuit Traces -->
  <line x1="32" y1="36" x2="32" y2="47" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="23" y1="32" x2="23" y2="39" stroke="#0ea5e9" stroke-width="1" stroke-linecap="round"/>
  <line x1="41" y1="32" x2="41" y2="39" stroke="#0ea5e9" stroke-width="1" stroke-linecap="round"/>
</svg>
